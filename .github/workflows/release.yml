name: Release

# Push a tag like v1.2.0 (or v1.2.0-beta.1) to publish the Docker image and a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Pre-releases (1.2.0-beta.1) do not move "latest".
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/briltago/printrio
          labels: |
            org.opencontainers.image.title=Printrio
            org.opencontainers.image.description=Self-hosted control centre for 3D printing
            org.opencontainers.image.licenses=AGPL-3.0-only WITH AdditionRef-Printrio-Module-Exception
            org.opencontainers.image.url=https://printrio.app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PRINTRIO_VERSION=${{ steps.version.outputs.version }}
            PRINTRIO_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags="--generate-notes --verify-tag"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags="$flags --prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "Printrio ${{ steps.version.outputs.version }}" $flags \
            --notes "Docker image: \`ghcr.io/briltago/printrio:${{ steps.version.outputs.version }}\`. Update: \`docker compose pull && docker compose up -d\` (a backup is made before migrations run)."
