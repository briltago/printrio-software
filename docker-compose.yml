# Printrio — self-hosted stack. Copy .env.example to .env and set a strong POSTGRES_PASSWORD.
services:
  printrio:
    # Released image; set PRINTRIO_VERSION in .env to pin a version (e.g. 1.2.0).
    image: ghcr.io/briltago/printrio:${PRINTRIO_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The server builds the database URL itself, so the password may contain any character.
      POSTGRES_HOST: postgres
      POSTGRES_USER: printrio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: printrio
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Printrio listens inside the container on the same port it is published on.
      PORT: ${PRINTRIO_PORT:-3000}
    volumes:
      - printrio-data:/data
    ports:
      - "${PRINTRIO_PORT:-3000}:${PRINTRIO_PORT:-3000}"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: printrio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: printrio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printrio -d printrio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  printrio-data:
  postgres-data:
